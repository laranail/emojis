name: Bug report
description: Something converts, renders or looks up wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, run `php artisan laranail::package-tools.doctor`. The `laranail/emojis dataset`
        line says whether the catalogue loaded and whether anything is running degraded.
  - type: textarea
    id: input
    attributes:
      label: Input and call
      description: The smallest text and call that shows the problem, e.g. `Emojis::text('hi :wave:')->toAscii()`.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual output
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: The output of `php artisan laranail::package-tools.doctor`, or `Emojis::create()->datasetVersion()` outside Laravel.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PHP, Laravel (if used), and `php -r 'echo PCRE_VERSION, " ", defined("INTL_ICU_VERSION") ? INTL_ICU_VERSION : "no intl";'`
    validations:
      required: true
