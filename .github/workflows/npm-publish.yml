name: Publish to npm

# Publishes @laranail/emojis-picker for a release tag. Its own workflow, not a job in release.yml, for two reasons:
# a failed npm publish never touches the Composer release, and it can be started by hand for a tag that already
# exists (`gh workflow run npm-publish.yml -f tag=v0.5.0`) using the workflow as it is on main. Re-running a
# tag's run uses the workflow file as it was at the tag, so a fix here could never reach that tag that way.
#
# Off until the repository variable NPM_PUBLISH is 'true'. Authenticates by npm trusted publishing (configure
# this file, npm-publish.yml, as the package's trusted publisher), or with an NPM_TOKEN secret when one is set.
# This repository was created after 2026-07-15, so GitHub issues it immutable OIDC subjects, which npm does
# not accept for publishing yet (npm/cli#9969): until that is fixed, publishing needs the NPM_TOKEN secret.
#
# The registry input publishes to GitHub Packages (npm.pkg.github.com) instead, with the run's own GITHUB_TOKEN:
# no npm account or secret involved, and the fallback .dev/tools/npm-release uses when npm will not take a token.
# GitHub Packages always requires authentication to install, even for a public package (see docs/tools/picker.md).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release tag to publish, e.g. v0.5.0'
        required: true
      registry:
        description: 'npm (registry.npmjs.org) or github (GitHub Packages)'
        type: choice
        options: [npm, github]
        default: npm

concurrency:
  group: ${{ github.workflow }}-${{ inputs.registry || 'npm' }}-${{ inputs.tag || github.ref_name }}
  # Cancelling a half-finished publish can leave a version reserved with nothing behind it.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish @laranail/emojis-picker to ${{ inputs.registry || 'npm' }}
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing, and provenance
      packages: write # GitHub Packages, with the run's GITHUB_TOKEN
    env:
      TARGET: ${{ inputs.registry || 'npm' }}

    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: ${{ (inputs.registry || 'npm') == 'github' && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org' }}
          scope: ${{ (inputs.registry || 'npm') == 'github' && '@laranail' || '' }}

      - name: Build the React adapter and the declarations
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run build:react
          npm run types
          npm test

      # The npm version is the Composer version: one tag, two registries.
      - name: Set the version
        run: npm version "${{ steps.tag.outputs.version }}" --no-git-tag-version --allow-same-version

      # With a token, say who it authenticates as before publishing, so a failure separates "the token does not
      # authenticate" from "it authenticates but cannot write to @laranail". Prints the account name only.
      - name: Check the token
        if: env.TARGET == 'npm'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "No NPM_TOKEN: publishing through trusted publishing."
            exit 0
          fi
          # The token's shape, never its value: a granular or automation token starts with npm_.
          case "$NPM_TOKEN" in
            npm_*) echo "NPM_TOKEN has the npm_ prefix (${#NPM_TOKEN} characters)." ;;
            *) echo "::warning::NPM_TOKEN does not start with npm_ (${#NPM_TOKEN} characters): it may be a token ID or a partial paste rather than the token." ;;
          esac
          # npm's own answer, error lines only (they never contain the token). A failed whoami is reported, not
          # fatal: some granular tokens cannot call it yet can publish, and the publish below is the real test.
          if out=$(NODE_AUTH_TOKEN="$NPM_TOKEN" npm whoami 2>&1); then
            echo "NPM_TOKEN authenticates as: $out"
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm access list packages @laranail 2>/dev/null || echo "(could not list @laranail packages with this token)"
          else
            echo "::warning::npm whoami refused NPM_TOKEN; trying the publish anyway. npm said:"
            { printf '%s\n' "$out" | grep -E '^npm (error|ERR!) (code|[0-9]{3}|E[0-9]{3})' || echo "(no error code in npm's output)"; } | head -5
          fi

      # Without a token, show the identity GitHub vouches for, which npm compares with the package's trusted
      # publisher (organization, repository, workflow file, environment). The claims only: the token is masked and
      # never printed. A mismatch here is the usual reason trusted publishing answers 404.
      - name: Show the trusted-publishing identity
        if: env.TARGET == 'npm'
        id: identity
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is set; trusted publishing is not used."
            exit 0
          fi
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$token"
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, repository, repository_owner, workflow_ref, job_workflow_ref, ref, event_name, environment}'
          # The subject is not a secret; the failure step below reads it to say why npm refused.
          echo "sub=$(printf '%s' "$payload" | base64 -d | jq -r .sub)" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$TARGET" = github ]; then
            # GitHub Packages signs no provenance, and its package inherits the repository's visibility.
            NODE_AUTH_TOKEN="$GITHUB_TOKEN" npm publish --provenance=false --registry https://npm.pkg.github.com
          elif [ -n "$NPM_TOKEN" ]; then
            # npm tries trusted publishing first whenever the job can mint an OIDC token, even with a token
            # configured, and this repository's immutable OIDC subject makes that exchange end in a 403
            # (npm/cli#9969). Hide the OIDC request variables from npm so the token is what authenticates.
            # Provenance is signed with that same OIDC identity, so it goes too: package.json asks for it,
            # hence the explicit --provenance=false. Restore both once npm fixes #9969 and the secret is gone.
            env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
              NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --provenance=false --access public
          else
            npm publish --provenance --access public
          fi

      # npm says why a trusted-publishing exchange failed only in its debug log, which the job does not keep.
      - name: Show npm's OIDC log lines
        if: failure() && env.TARGET == 'npm'
        run: |
          { grep -hiE 'oidc|trusted|id.?token|provenance' ~/.npm/_logs/*-debug-0.log || echo "(no OIDC lines in the npm debug log)"; } | tail -40

      # A 403 "OIDC permission denied for this action" after a successful token exchange has two known causes,
      # and the subject claim tells them apart. Repositories created or renamed after 2026-07-15 issue GitHub's
      # immutable subject (repo:owner@<id>/repo@<id>:...), which npm does not accept for publishing yet
      # (npm/cli#9969, open): only an NPM_TOKEN secret publishes from such a repository today. Otherwise the
      # trusted publisher on npmjs.com may still allow staged publishes only.
      - name: Explain a refused trusted publish
        if: failure() && steps.identity.outputs.sub != ''
        env:
          SUB: ${{ steps.identity.outputs.sub }}
        run: |
          if printf '%s' "$SUB" | grep -Eq '^repo:[^/]+@[0-9]+/[^:]+@[0-9]+:'; then
            echo "::error::This repository issues GitHub's immutable OIDC subject ($SUB), which npm does not accept for publishing yet (https://github.com/npm/cli/issues/9969). Add a granular npm token with publish rights on @laranail/emojis-picker as the NPM_TOKEN repository secret; this workflow then publishes with it (without provenance until npm fixes #9969, then delete the secret). Set it and publish every missing version with .dev/tools/npm-release."
          else
            echo "::error::npm refused the publish although the token exchange worked. On npmjs.com, open the package's trusted publisher and enable direct npm publish under Allowed actions (new publishers allow staged publishes only)."
          fi
