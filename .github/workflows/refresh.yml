name: Refresh upstream data

# Weekly: move every source to its newest release, rebuild, cross-check against the Unicode charts,
# getemoji.com and copychar.cc, run the gates, and open a pull request for review. Never pushes to main.
on:
  schedule:
    - cron: '0 10 * * 1' # Mondays 10:00 UTC (06:00 America/New_York, with the Dependabot run)
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh and propose
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write      # push the refresh branch
      pull-requests: write # open or update the pull request
      actions: write       # start Tests and Static analysis on that branch
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: dom, curl, mbstring, intl
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: composer update --no-interaction --no-progress --prefer-dist

      - name: Install the margin-measuring tool
        working-directory: .dev/tools/measure
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Refresh
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php .dev/tools/refresh.php

      - name: Gates
        run: |
          composer sync-check
          composer test
          php .dev/tools/cross-check.php --strict

      # Opened with the built-in token, so no personal token has to be created, approved or rotated. A pull
      # request opened that way triggers no pull_request workflows, so the next step starts the required ones
      # itself (workflow_dispatch is the one event GITHUB_TOKEN may trigger); their runs report on the branch's
      # head commit under the same check names, which is what the main ruleset requires.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          token: ${{ github.token }}
          branch: chore/refresh-upstream-data
          delete-branch: true
          commit-message: Refresh upstream emoji data
          title: Refresh upstream emoji data
          body-path: build/refresh-report.md
          labels: dependencies
          add-paths: |
            database/**
            docs/licences.md
            src/Core/Enums/**

      - name: Run the required checks on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-upstream-data
        run: |
          gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run static-analysis.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Started Tests and Static analysis on $BRANCH for #${{ steps.pr.outputs.pull-request-number }}." >> "$GITHUB_STEP_SUMMARY"
