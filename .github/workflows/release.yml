name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling a half-finished release can leave a tag published with no notes or SBOM.
  cancel-in-progress: false

permissions:
  contents: write

env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  release:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install runtime dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Generate an SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: emojis.cdx.json
          upload-release-assets: false
          upload-artifact: false

      - name: Extract this version's changelog section
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for $version; a release without real notes is incomplete." >&2
            exit 1
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            printf '%s\n' "$notes"
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/laranail/emojis/blob/main/CHANGELOG.md)."
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Updates in place when the moving tag re-fires the workflow against an existing release.
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          files: emojis.cdx.json
