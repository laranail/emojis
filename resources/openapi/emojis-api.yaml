openapi: 3.1.0
info:
  title: laranail/emojis API
  version: v1
  description: >-
    Read-only JSON over the emoji catalogue, symbols, kaomoji, emoticons and status tags. Disabled by default;
    enable with laranail.emojis.api.enabled. Paths are relative to the configured prefix and version
    (default /laranail/emojis/api/v1). With laranail.emojis.api.cache_headers set (the default), responses
    carry an ETag and answer 304 to If-None-Match.
  license:
    name: MIT
servers:
  - url: /laranail/emojis/api/v1
components:
  parameters:
    locale:
      name: locale
      in: query
      description: A locale tag. An unshipped one falls back (pt-BR to pt, then en) rather than failing.
      schema: { type: string, maxLength: 35, pattern: '^[A-Za-z]{2,3}(?:[_-][A-Za-z0-9]{2,8})*$' }
  responses:
    NotFound:
      description: Nothing matches.
      content:
        application/json:
          schema: { type: object, properties: { message: { type: string } }, required: [message] }
    Invalid:
      description: A parameter is out of bounds. The message names the field, never the input.
    Throttled:
      description: Too many requests from this client; retry after the Retry-After header's seconds.
  schemas:
    PickerEmoji:
      type: object
      required: [emoji, hexcode, name, shortcode, keywords, version, skins]
      properties:
        emoji: { type: string, examples: ['🤝'] }
        hexcode: { type: string, examples: ['1F91D'] }
        name: { type: string, description: 'In the requested locale.' }
        shortcode: { type: [string, 'null'] }
        keywords: { type: array, items: { type: string } }
        version: { type: string, description: 'The Emoji version that added it.', examples: ['3.0'] }
        skins:
          type: object
          description: >-
            Tone key to hexcode, for the toned forms the policy permits: "1" to "5" for one person, "1-5" and
            so on (a tone per person) for several. Hexcodes, not characters. Empty when it takes no tone.
          additionalProperties: { type: string }
          examples: [{ '3': '1F91D-1F3FD', '3-5': '1FAF1-1F3FD-200D-1FAF2-1F3FF' }]
        skin_versions:
          description: >-
            Present when the toned forms are newer than the emoji: their Emoji version, one string when they
            share it, otherwise tone key to version.
          oneOf:
            - { type: string, examples: ['14.0'] }
            - { type: object, additionalProperties: { type: string } }
        base:
          description: Present, and false, when the policy refuses the emoji itself but permits some of its toned forms.
          const: false
    PickerGroup:
      type: object
      required: [slug, label, emoji]
      properties:
        slug: { type: string, examples: [smileys_and_emotion] }
        label: { type: string, description: 'Translated through the picker translations; English when the locale has none.' }
        emoji: { type: array, items: { $ref: '#/components/schemas/PickerEmoji' } }
    PickerImageSet:
      type: object
      required: [set, licence]
      description: >-
        How to draw emoji from one image set. A rule-based set (twemoji, noto, openmoji, joypixels) gives base,
        rule, suffix and the hexcodes it does not cover; the URL is base + "/" + rule(hexcode) + suffix. Any
        other set gives each covered hexcode's path below base, or its full URL.
      properties:
        set: { type: string, examples: [twemoji] }
        licence: { type: string }
        base: { type: string }
        rule: { type: string, enum: [twemoji, noto, openmoji, joypixels] }
        suffix: { type: string, examples: ['.svg'] }
        missing: { type: array, items: { type: string } }
        paths: { type: object, additionalProperties: { type: string } }
        urls: { type: object, additionalProperties: { type: string } }
    PickerPayload:
      type: object
      required: [dataset, locale, groups, custom, delimiters]
      properties:
        dataset: { type: string }
        locale: { type: string, description: 'The locale the payload is in, after fallback.' }
        groups: { type: array, items: { $ref: '#/components/schemas/PickerGroup' } }
        custom:
          type: array
          items:
            type: object
            required: [name, label, image, fallback]
            properties:
              name: { type: string }
              label: { type: string }
              image: { type: string, description: 'A URL or a data URI.' }
              fallback: { type: [string, 'null'] }
        delimiters:
          type: array
          description: The configured shortcode delimiters; a custom emoji is inserted as open + name + close.
          prefixItems: [{ type: string }, { type: string }]
          minItems: 2
          maxItems: 2
        kaomoji:
          type: array
          description: 'Present when the Kaomoji tab is on: groups of { text, name }.'
          items: { type: object, properties: { slug: { type: string }, label: { type: string }, items: { type: array, items: { type: object, properties: { text: { type: string }, name: { type: string } } } } } }
        symbols:
          type: array
          description: 'Present when the Symbols tab is on: groups of { char, name }.'
          items: { type: object, properties: { slug: { type: string }, label: { type: string }, items: { type: array, items: { type: object, properties: { char: { type: string }, name: { type: string } } } } } }
        images:
          description: 'Present unless the picker draws native emoji only: the set it falls back to, or draws everything with.'
          $ref: '#/components/schemas/PickerImageSet'
        imageSets:
          type: array
          description: 'Present when the set switcher is on: every set the user may choose, the default first.'
          items: { $ref: '#/components/schemas/PickerImageSet' }
    Emoji:
      type: object
      properties:
        emoji: { type: string, examples: ['🚀'] }
        hexcode: { type: string, examples: ['1F680'] }
        name: { type: string, description: 'In the requested locale.' }
        english_name: { type: string }
        slug: { type: string }
        shortcode: { type: [string, 'null'] }
        shortcodes: { type: array, items: { type: string } }
        emoticons: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        group: { type: string }
        subgroup: { type: string }
        version: { type: string }
        type: { type: string }
        skin_tones: { type: array, items: { type: integer } }
        skins: { type: object, additionalProperties: { type: string } }
        base: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        text_presentation: { type: boolean }
        tag: { type: [string, 'null'], description: 'The status tag the emoji is written as, if any.' }
paths:
  /:
    get:
      summary: Describe the dataset, counts, locales, groups and links.
      parameters: [{ $ref: '#/components/parameters/locale' }]
      responses: { '200': { description: 'The description.' } }
  /emojis:
    get:
      summary: List emoji, filtered and paged. The configured emoji policy applies.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: group, in: query, schema: { type: string } }
        - { name: subgroup, in: query, schema: { type: string } }
        - { name: version, in: query, description: Only emoji a platform at this Emoji version can show., schema: { type: string } }
        - { name: tones, in: query, description: Include skin-tone variants., schema: { type: boolean } }
        - { $ref: '#/components/parameters/locale' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
      responses:
        '200':
          description: A page of emoji.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Emoji' } }
                  meta: { type: object, properties: { total: { type: integer }, limit: { type: integer }, offset: { type: integer } } }
        '422': { $ref: '#/components/responses/Invalid' }
  /emojis/{key}:
    get:
      summary: One emoji, by character, hexcode, shortcode or name, percent-encoded.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/locale' }
      responses:
        '200': { description: The emoji., content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Emoji' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /picker:
    get:
      summary: Everything an emoji picker draws for one locale, grouped, with custom emoji. Policy applied.
      parameters: [{ $ref: '#/components/parameters/locale' }]
      responses:
        '200':
          description: The payload, and how many emoji and custom emoji it lists.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PickerPayload' }
                  meta: { type: object, required: [count], properties: { count: { type: integer } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/Throttled' }
  /symbols:
    get:
      summary: The symbol groups, with each group's characters.
      responses: { '200': { description: 'The groups.' } }
  /symbols/{group}:
    get:
      summary: Every symbol in one group.
      parameters: [{ name: group, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'The symbols.' }
        '404': { $ref: '#/components/responses/NotFound' }
  /kaomoji:
    get:
      summary: Kaomoji, optionally one group, optionally ASCII only.
      parameters:
        - { name: group, in: query, schema: { type: string, pattern: '^[a-z0-9_]+$' } }
        - { name: ascii, in: query, schema: { type: boolean } }
      responses:
        '200': { description: 'The kaomoji, with every group in meta.' }
        '404': { $ref: '#/components/responses/NotFound' }
  /emoticons:
    get:
      summary: Every emoticon text conversion recognises, mapped to its emoji's hexcode; meta.opt_in_only lists the risky ones.
      responses: { '200': { description: 'The map.' } }
  /tags:
    get:
      summary: The status tags, with their groups.
      responses: { '200': { description: 'The tags.' } }
